name: Clinic API CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c4976c70817c76a9bf697ecb0142bfae498c5 # v2.40.0
        with:
          php-version: '8.2'
          extensions: mbstring, xml, sqlite3, pdo_sqlite
          coverage: none

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate Key
        run: php artisan key:generate

      - name: Run Database Migrations & Seed
        run: php artisan migrate:fresh --seed --env=testing

      - name: Run Tests
        run: php artisan test

      - name: Check Code Style with Pint
        run: vendor/bin/pint --test
